    <text x="746" y="267" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="650">只读</text>

    <rect x="850" y="22" width="504" height="268" rx="16" fill="#111b31" stroke="#3b82f6" stroke-opacity="0.55"/>
