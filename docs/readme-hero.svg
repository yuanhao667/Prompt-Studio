    <rect x="876" y="82" width="452" height="1" fill="#26334a"/>
    <text x="876" y="116" fill="#60a5fa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">角色</text>
    <rect x="876" y="132" width="360" height="10" rx="5" fill="#475569"/>
    <rect x="876" y="153" width="414" height="10" rx="5" fill="#334155"/>
    <text x="876" y="196" fill="#60a5fa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">目标</text>
    <rect x="876" y="212" width="392" height="10" rx="5" fill="#475569"/>
    <rect x="876" y="233" width="318" height="10" rx="5" fill="#334155"/>
    <rect x="1208" y="252" width="120" height="22" rx="11" fill="#1e3a8a"/>
    <text x="1242" y="267" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="650">保存为 V4</text>
  </g>

  <text x="800" y="836" text-anchor="middle" fill="#6f7e94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" letter-spacing="2">Markdown 本地存储 · SQLite 版本历史 · API Key 只保存在你的 Mac</text>
