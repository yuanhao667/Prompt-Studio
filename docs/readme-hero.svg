    <path d="M27 16h12l-3 15h12l3-15h12l-3 15h9v11H58l-3 15h10v11H53l-3 14H38l3-14H29l-3 14H14l3-14H8V57h11l3-15H12V31h12zM34 42l-3 15h12l3-15z" fill="url(#brand)" transform="scale(.82) translate(8 0)"/>
    <text x="100" y="38" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">提示词工坊</text>
    <text x="101" y="68" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" letter-spacing="3">本地 · 结构化 · 可追溯</text>
  </g>

  <text x="112" y="255" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="66" font-weight="730" letter-spacing="-2">清晰创作，安心对照。</text>
  <text x="112" y="322" fill="url(#brand)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="66" font-weight="730" letter-spacing="-2">每次迭代，都有迹可循。</text>
  <text x="116" y="373" fill="#a8b4c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">面向结构化提示词与审慎迭代的本地原生工作台。</text>

