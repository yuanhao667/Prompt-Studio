<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">提示词工坊工作流</title>
  <desc id="desc">结构化提示词编辑、智能对照与不可变版本历史。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0c1b35"/>
      <stop offset="1" stop-color="#11183a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="280" cy="130" r="240" fill="#0ea5e9" opacity="0.14" filter="url(#blur)"/>
  <circle cx="1390" cy="730" r="300" fill="#7c3aed" opacity="0.17" filter="url(#blur)"/>
  <path d="M0 716 C340 635 486 820 790 730 C1070 648 1258 610 1600 694 V900 H0Z" fill="url(#glow)"/>

  <g transform="translate(112 90)">
